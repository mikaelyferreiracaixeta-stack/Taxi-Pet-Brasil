<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Condutor e Veículo - Táxi Pet Brasil</title>
    <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="CSS/style.css">
<link rel="stylesheet" href="condutor.css">

</head>
<body>

    <header class="site-header">
        <nav class="area-navegacao">
            <a href="index.html" class="logo-link">
                <img class="logo" src="img/logo.png" alt="Logo Táxi Pet Brasil" width="200" height="100">
            </a>
            
            <ul class="menu-header">
                <li><a class="icones" href="index.html"><i class="fa-solid fa-house"></i> Início</a></li>
                <li><a class="icones" href="agendamento.html"><i class="fa-solid fa-calendar-check"></i> Agendar Viagem</a></li>
                <li><a class="icones" href="frota.html"><i class="fa-solid fa-van-shuttle"></i> Nossa Frota</a></li>
                <li><a class="icones" href="contaPet.html"><i class="fa-solid fa-paw"></i> Meus Pets</a></li>
                <li><a class="icones" href="clinica.html"><i class="fa-solid fa-hospital"></i> Clínica</a></li>
                <li><a class="icones ativo" href="condutor.html"><i class="fa-solid fa-user"></i> Condutor</a></li>
                <li><a class="icones" href="contato.html"><i class="fa-solid fa-headset"></i> Contato</a></li>
                <li><a class="icones" href="login.html"><i class="fa-solid fa-user-lock"></i> Entrar</a></li>
                <li><a class="icones" href="pagamento.html"><i class="fa-solid fa-credit-card"></i> Pagamento</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <form action="#" method="POST">

                <!-- ==================== DADOS DO CONDUTOR ==================== -->
                <h2>Cadastro de Condutor</h2>
                
                <!-- Nome do Motorista -->
                <div class="form-group">
                    <label for="nome_motorista">Nome do Motorista:</label>
                    <input type="text" id="nome_motorista" name="nome_motorista" maxlength="100" required placeholder="Ex: João da Silva Santos">
                </div>

                <div class="row">
                    <!-- CPF -->
                    <div class="col form-group">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" name="cpf" maxlength="11" required placeholder="00000000000" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>

                    <!-- RG -->
                    <div class="col form-group">
                        <label for="rg">RG:</label>
                        <input type="text" id="rg" name="rg" maxlength="20" required placeholder="Ex: 1234567 SSP/DF">
                    </div>
                </div>

                <div class="row">
                    <!-- CNH -->
                    <div class="col form-group">
                        <label for="cnh">CNH:</label>
                        <input type="text" id="cnh" name="cnh" maxlength="15" required placeholder="00000000000" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                    </div>

                    <!-- Validade da CNH -->
                    <div class="col form-group">
                        <label for="validade_cnh">Validade da CNH:</label>
                        <input type="date" id="validade_cnh" name="validade_cnh" required>
                    </div>
                </div>

                <div class="row">
                    <!-- Telefone -->
                    <div class="col form-group">
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" maxlength="20" placeholder="(61) 3333-4444">
                    </div>

                    <!-- WhatsApp -->
                    <div class="col form-group">
                        <label for="whtsap">WhatsApp:</label>
                        <input type="tel" id="whtsap" name="whtsap" maxlength="20" required placeholder="(61) 99999-8888">
                    </div>
                </div>

                <!-- E-mail -->
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" maxlength="100" required placeholder="motorista@email.com">
                </div>

                <!-- Endereço Completo -->
                <div class="form-group">
                    <label for="endereco_completo">Endereço Completo:</label>
                    <input type="text" id="endereco_completo" name="endereco_completo" maxlength="255" required placeholder="Rua, Avenida, Quadra, Número, Bairro, Cidade - UF">
                </div>

                <!-- Observações -->
                <div class="form-group">
                    <label for="obs">Observações / Informações:</label>
                    <textarea id="obs" name="obs" rows="3" maxlength="255" placeholder="Anotações gerais sobre o condutor (ex: disponibilidade, categoria CNH)..."></textarea>
                </div>

                <hr>

                <!-- ==================== DADOS DO CARRO ==================== -->
                <h2>Cadastro de Carro</h2>
                
                <div class="row">

                    <!-- ID_Motorista -->
                    <div class="col form-group">
                        <label for="id_motorista">ID do Motorista Vinculado:</label>
                        <input type="text" id="id_motorista" name="id_motorista" maxlength="11" required placeholder="Ex: CPF ou ID do motorista">
                    </div>
                </div>

                <div class="row">
                    <!-- Marca -->
                    <div class="col form-group">
                        <label for="marca">Marca:</label>
                        <input type="text" id="marca" name="marca" maxlength="50" required placeholder="Ex: Chevrolet, Toyota, Fiat">
                    </div>

                    <!-- Modelo -->
                    <div class="col form-group">
                        <label for="modelo">Modelo:</label>
                        <input type="text" id="modelo" name="modelo" maxlength="50" required placeholder="Ex: Onix, Corolla, Fiorino">
                    </div>
                </div>

                <div class="row">
                    <!-- Ano -->
                    <div class="col form-group">
                        <label for="ano">Ano:</label>
                        <input type="text" id="ano" name="ano" maxlength="8" required placeholder="Ex: 2024" oninput="this.value = this.value.replace(/[^0-9\/]/g, '')">
                    </div>

                    <!-- Cor -->
                    <div class="col form-group">
                        <label for="cor">Cor:</label>
                        <input type="text" id="cor" name="cor" maxlength="50" required placeholder="Ex: Branco, Prata, Preto">
                    </div>

                    <!-- Placa -->
                    <div class="col form-group">
                        <label for="placa">Placa:</label>
                        <input type="text" id="placa" name="placa" maxlength="8" required placeholder="Ex: ABC1D23" style="text-transform: uppercase;" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '')">
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-submit">Salvar Formulário</button>
                </div>

            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Táxi Pet Brasil. Todos os direitos reservados.</p>
    </footer>

    <script src="js/condutor.js"></script>
</body>
</html>
