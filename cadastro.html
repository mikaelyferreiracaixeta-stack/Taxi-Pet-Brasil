<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - PetTaxi</title>
   <link rel="stylesheet" href="cadastro.css">
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- Cabeçalho / Navegação -->
    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">🐾 PetTaxi</a>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="frota.html">Nossa Frota</a>
                <a href="agendamentos.html">Agendamento</a>
                <a href="contato.html">Contato</a>
            </div>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="register-container">
        <div class="register-box">
            <h1>Crie sua Conta Pet</h1>
            <p>Cadastre-se para gerenciar seus animais e agendar transportes de forma rápida.</p>

            <form action="#" method="POST" onsubmit="alert('Cadastro realizado com sucesso! Bem-vindo ao PetTaxi.'); return false;">
                
                <!-- Nome Completo -->
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome completo">
                </div>

                <!-- E-mail -->
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="Ex: seuemail@dominio.com">
                </div>

                <!-- CPF e WhatsApp na mesma linha -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" required placeholder="000.000.000-00">
                    </div>
                    <div class="form-group">
                        <label for="whatsapp">WhatsApp / Celular</label>
                        <input type="tel" id="whatsapp" required placeholder="(11) 99999-9999">
                    </div>
                </div>

                <!-- Senha e Confirmação de Senha -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" required placeholder="No mínimo 6 caracteres">
                    </div>
                    <div class="form-group">
                        <label for="confirma-senha">Confirmar Senha</label>
                        <input type="password" id="confirma-senha" required placeholder="Repita a senha">
                    </div>
                </div>

                <!-- Termos de Uso -->
                <label class="terms-group">
                    <input type="checkbox" required>
                    <span>Eu li e aceito os <a href="#">Termos de Serviço</a> e a <a href="#">Política de Privacidade</a> para o transporte seguro do meu pet.</span>
                </label>

                <!-- Botão de Envio -->
                <button type="submit" class="btn-register">Finalizar Cadastro</button>

                <!-- Link para quem já tem login -->
                <div class="login-link">
                    Já tem uma conta? <a href="login.html">Faça Login</a>
                </div>

            </form>
        </div>
    </main>

    <footer>
        <p>&copy; Táxi Pet Serviços Automotivos. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
