<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forma de Pagamento</title>
    <link rel="stylesheet" href="pagamento.css">
    <style>
        /* Garante que a classe hidden esconda os elementos */
        .hidden { display: none !important; }
        
        /* Estilo básico apenas para o botão se destacar */
        .btn-submit {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-submit:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="checkout-container">
        <form action="/processar-pagamento" method="POST" class="payment-card">
            <h3 class="payment-title">Escolha a Forma de Pagamento</h3>

            <!-- Seleção do Método (FECHADO CORRETAMENTE AQUI) -->
            <div class="payment-methods">
                <label class="method-option" for="cartao">
                    <input type="radio" id="cartao" name="metodo_pagamento" value="cartao" checked onchange="mudarMetodoPagamento('cartao')">
                    <span>💳 Cartão</span>
                </label>
                <label class="method-option" for="pix">
                    <input type="radio" id="pix" name="metodo_pagamento" value="pix" onchange="mudarMetodoPagamento('pix')">
                    <span>⚡ Pix</span>
                </label>
            </div> <!-- <--- Faltava fechar esta div -->

            <!-- Seção de Dados do Cartão -->
            <div id="dados-cartao" class="payment-details">
                <h4 class="section-subtitle">Dados do Cartão</h4>
                <div class="form-group">
                    <label for="nome_cartao">Nome no Cartão</label>
                    <input type="text" id="nome_cartao" name="nome_cartao" class="form-control" required placeholder="Como está no cartão">
                </div>
                <div class="form-group">
                    <label for="numero_cartao">Número do Cartão</label>
                    <input type="text" id="numero_cartao" name="numero_cartao" class="form-control" required placeholder="0000 0000 0000 0000">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="validade">Validade</label>
                        <input type="text" id="validade" name="validade" class="form-control" required placeholder="MM/AA">
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" name="cvv" class="form-control" required placeholder="123">
                    </div>
                </div>
            </div>

            <!-- Seção do Pix -->
            <div id="dados-pix" class="payment-details hidden">
                <h4 class="section-subtitle">Pagamento via Pix</h4>
                <div class="pix-instructions">
                    <p>O código QR Pix será gerado após finalizar a compra.</p>
                    <p>💡 <strong>Dica:</strong> O pagamento por Pix é aprovado instantaneamente!</p>
                </div>
            </div>

            <!-- Botão para enviar o formulário -->
            <button type="submit" class="btn-submit">Finalizar Compra</button>

        </form> <!-- <--- Faltava fechar o formulário -->
    </div> <!-- <--- Faltava fechar a div checkout-container -->

    <script>
        function mudarMetodoPagamento(metodo) {
            // Seleciona apenas as seções que realmente existem no HTML
            const secaoCartao = document.getElementById('dados-cartao');
            const secaoPix = document.getElementById('dados-pix');

            // Esconde todas primeiro (Removido o boleto que não existia)
            if (secaoCartao) secaoCartao.classList.add('hidden');
            if (secaoPix) secaoPix.classList.add('hidden');

            // Remove a obrigatoriedade dos inputs do cartão por padrão
            const inputsCartao = secaoCartao.querySelectorAll('input');
            inputsCartao.forEach(input => input.required = false);

            // Mostra a seção correta baseada na seleção
            if (metodo === 'cartao') {
                secaoCartao.classList.remove('hidden');
                inputsCartao.forEach(input => input.required = true); // Ativa obrigatórios do cartão
            } else if (metodo === 'pix') {
                secaoPix.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
