<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Táxi Pet - Táxi Pet Brasil</title>
    
    <!-- Folhas de Estilo (CSS) -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="agendamento.css">
    
    <!-- Font Awesome (Ícones Oficiais) -->
    <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- ==========================================
         CABEÇALHO & NAVEGAÇÃO PADRÃO
         ========================================== -->
    <header class="site-header">
        <nav class="area-navegacao">
            <a href="index.html" class="logo-link">
                <img class="logo" src="img/logo.png" alt="Logo Táxi Pet Brasil" width="200" height="100">
            </a>
            
            <ul class="menu-header">
                <li><a class="icones" href="index.html"><i class="fa-solid fa-house"></i> Início</a></li>
                <li><a class="icones" href="agendamento.html"><i class="fa-solid fa-calendar-check"></i> Agendar Viagem</a></li>
                <li><a class="icones" href="frota.html"><i class="fa-solid fa-van-shuttle"></i> Nossa Frota</a></li>
                <li><a class="icones" href="contaPet.html"><i class="fa-solid fa-paw"></i> Meus Pets</a></li>
                <li><a class="icones" href="contato.html"><i class="fa-solid fa-headset"></i> Contato</a></li>
                <li><a class="icones" href="login.html"><i class="fa-solid fa-user-lock"></i> Entrar</a></li>
                <li><a class="icones" href="pagamento.html"><i class="fa-solid fa-credit-card"></i> Pagamento</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container" style="max-width: 700px; margin: 40px auto; padding: 0 20px;">
        <div class="form-container">
            <h1 style="text-align: center; margin-bottom: 5px;">Agende a Viagem do seu Pet</h1>
            <p class="subtitle" style="text-align: center; color: #666; margin-bottom: 30px;">Preencha os dados abaixo e envie o seu pedido direto para o nosso WhatsApp.</p>

            <form id="formAgendamento">
                
                <!-- PASSO 1: Dados do Tutor -->
                <fieldset style="border: 1px solid #ccc; padding: 20px; border-radius: 6px; margin-bottom: 20px;">
                    <legend style="padding: 0 10px; font-weight: bold;"> Dados do Tutor</legend>
                    
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="nome" style="display:block; margin-bottom:5px;">Nome Completo</label>
                        <input type="text" id="nome" required placeholder="Ex: Maria Silva" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                    </div>

                    <div class="form-row" style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="whatsapp" style="display:block; margin-bottom:5px;">WhatsApp / Telefone</label>
                            <input type="tel" id="whatsapp" required placeholder="(61) 99999-9999" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="email" style="display:block; margin-bottom:5px;">E-mail</label>
                            <input type="email" id="email" required placeholder="maria@email.com" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                        </div>
                    </div>
                </fieldset>

                <!-- PASSO 2: Dados do Pet -->
                <fieldset style="border: 1px solid #ccc; padding: 20px; border-radius: 6px; margin-bottom: 20px;">
                    <legend style="padding: 0 10px; font-weight: bold;"> Dados do Pet</legend>
                    
                    <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="nome-pet" style="display:block; margin-bottom:5px;">Nome do Pet</label>
                            <input type="text" id="nome-pet" required placeholder="Ex: Thor" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="tipo-pet" style="display:block; margin-bottom:5px;">Espécie</label>
                            <select id="tipo-pet" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; height: 40px;">
                                <option value="" disabled selected>Selecione...</option>
                                <option value="Cachorro">Cachorro</option>
                                <option value="Gato">Gato</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row" style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="porte-pet" style="display:block; margin-bottom:5px;">Porte do Animal</label>
                            <select id="porte-pet" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; height: 40px;">
                                <option value="" disabled selected>Selecione...</option>
                                <option value="Pequeno (Até 10kg)">Pequeno (Até 10kg)</option>
                                <option value="Médio (11kg a 25kg)">Médio (11kg a 25kg)</option>
                                <option value="Grande (Acima de 25kg)">Grande (Acima de 25kg)</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label style="display:block; margin-bottom:9px;">O tutor vai acompanhar?</label>
                            <div class="radio-group" style="display: flex; gap: 15px;">
                                <label class="radio-item" style="cursor:pointer;">
                                    <input type="radio" name="acompanhante" value="Sim" checked> Sim
                                </label>
                                <label class="radio-item" style="cursor:pointer;">
                                    <input type="radio" name="acompanhante" value="Não (O pet vai sozinho)"> Não
                                </label>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <!-- PASSO 3: Detalhes da Corrida -->
                <fieldset style="border: 1px solid #ccc; padding: 20px; border-radius: 6px; margin-bottom: 25px;">
                    <legend style="padding: 0 10px; font-weight: bold;"> Detalhes do Percurso</legend>
                    
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="origem" style="display:block; margin-bottom:5px;">Endereço de Origem</label>
                        <input type="text" id="origem" required placeholder="Ex: Rua das Flores, 123, Gama - DF" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                    </div>
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="destino" style="display:block; margin-bottom:5px;">Endereço de Destino (Clínica/Petshop)</label>
                        <input type="text" id="destino" required placeholder="Ex: Clínica Veterinária Amigo Pet, Gama Centro" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                    </div>
                    <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="data" style="display:block; margin-bottom:5px;">Data da Viagem</label>
                            <input type="date" id="data" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="hora" style="display:block; margin-bottom:5px;">Hora da Viagem</label>
                            <input type="time" id="hora" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="observacoes" style="display:block; margin-bottom:5px;">Observações / Alertas Médicos (opcional)</label>
                        <textarea id="observacoes" placeholder="Ex: O pet tem medo de barulhos, levar na caixa de transporte..." style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; height: 80px; resize: vertical;"></textarea>
                    </div>
                </fieldset>

                <!-- BOTÃO DE ENVIO -->
                <div class="form-actions">
                    <button type="submit" class="btn-enviar" style="width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">
                        <i class="fa-brands fa-whatsapp"></i> Solicitar Agendamento via WhatsApp
                    </button>
