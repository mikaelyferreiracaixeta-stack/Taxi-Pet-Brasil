<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Táxi Pet Brasil</title>
    
    <!-- Folhas de Estilo (CSS) -->
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="login.css">
    
    <!-- Font Awesome (Ícones Oficiais) -->
    <link rel="stylesheet" href="https://cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <!-- ==========================================
         CABEÇALHO & NAVEGAÇÃO PADRÃO
         ========================================== -->
    <header class="site-header">
        <nav class="area-navegacao">
            <a href="index.html" class="logo-link">
                <img class="logo" src="img/logo.png" alt="Logo Táxi Pet Brasil" width="200" height="100">
            </a>
            
            <ul class="menu-header">
                <li><a class="icones" href="index.html"><i class="fa-solid fa-house"></i> Início</a></li>
                <li><a class="icones" href="agendamento.html"><i class="fa-solid fa-calendar-check"></i> Agendar Viagem</a></li>
                <li><a class="icones" href="frota.html"><i class="fa-solid fa-van-shuttle"></i> Nossa Frota</a></li>
                <li><a class="icones" href="contaPet.html"><i class="fa-solid fa-paw"></i> Meus Pets</a></li>
                <li><a class="icones" href="contato.html"><i class="fa-solid fa-headset"></i> Contato</a></li>
                <li><a class="icones" href="login.html"><i class="fa-solid fa-user-lock"></i> Entrar</a></li>
                <li><a class="icones" href="pagamento.html"><i class="fa-solid fa-credit-card"></i> Pagamento</a></li>
            </ul>
        </nav>
    </header>

    <!-- ==========================================
         ÁREA DO FORMULÁRIO DE LOGIN
         ========================================== -->
    <main class="login-container">
        <div class="login-box">
            <h1>Bem-vindo de Volta!</h1>
            <p>Acesse seu painel para acompanhar as viagens do seu pet.</p>

            <!-- Redirecionamento corrigido para contaPet.html -->
            <form action="contaPet.html" method="GET" onsubmit="alert('Login efetuado com sucesso!');">
                
                <!-- Campo E-mail -->
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seuemail@dominio.com">
                </div>

                <!-- Campo Senha -->
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="Digite sua senha">
                </div>

                <!-- Opções extras -->
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox"> Lembrar de mim
                    </label>
                    <a href="#" class="forgot-password" onclick="alert('Um link de recuperação foi enviado ao e-mail informado.');">Esqueceu a senha?</a>
                </div>

                <!-- Botão de Login -->
                <button type="submit" class="btn-login">Entrar</button>

                <!-- Link para Criar Conta -->
                <div class="register-link">
                    Ainda não tem cadastro? <a href="cadastro.html">Cadastre-se</a>
                </div>

            </form>
        </div>
    </main>

    <!-- ==========================================
         RODAPÉ PADRÃO
         ========================================== -->
    <footer class="site-footer">
        <p>&copy; 2026 Táxi Pet Brasil. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
