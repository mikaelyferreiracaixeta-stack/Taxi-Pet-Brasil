            <h1>Login</h1>
            <form action="processar_login.php" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha:</label>
                    <input type="password" class="form-control" id="senha" name="senha" required>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('senha');
 
    form.addEventListener('submit', (event) => {
        let isValid = true;
 
        // Limpa mensagens de erro anteriores
        document.querySelectorAll('.invalid-feedback').forEach(el => el.remove());
        emailInput.classList.remove('is-invalid');
        senhaInput.classList.remove('is-invalid');
 
        // Validação de E-mail
        const emailValue = emailInput.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
       
        if (!emailValue) {
            mostrarErro(emailInput, 'Por favor, informe seu e-mail.');
            isValid = false;
        } else if (!emailRegex.test(emailValue)) {
            mostrarErro(emailInput, 'Digite um e-mail válido.');
            isValid = false;
        }
 
        // Validação de Senha
        const senhaValue = senhaInput.value;
       
        if (!senhaValue) {
            mostrarErro(senhaInput, 'Por favor, informe sua senha.');
            isValid = false;
        } else if (senhaValue.length < 6) {
            mostrarErro(senhaInput, 'A senha deve ter pelo menos 6 caracteres.');
            isValid = false;
        }
 
        // Cancela o envio se o formulário for inválido
        if (!isValid) {
            event.preventDefault();
        }
    });
 
    function mostrarErro(input, mensagem) {
        input.classList.add('is-invalid');
       
        const feedback = document.createElement('div');
        feedback.className = 'invalid-feedback';
        feedback.innerText = mensagem;
       
        input.parentElement.appendChild(feedback);
    }
});
    </script>
