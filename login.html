<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - PetTaxi</title>
    <link rel="stylesheet" href="login.css">
   
</head>
<body>

    <!-- Cabeçalho / Navegação -->
    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">🐾 PetTaxi</a>
            <div class="nav-links">
                <a href="index.html">Início</a>
                <a href="frota.html">Nossa Frota</a>
                <a href="agendamentos.html">Agendamento</a>
                <a href="contato.html">Contato</a>
            </div>
        </nav>
    </header>

    <!-- Área do Formulário de Login -->
    <main class="login-container">
        <div class="login-box">
            <h1>Bem-vindo de Volta!</h1>
            <p>Acesse seu painel para acompanhar as viagens do seu pet.</p>

            <form action="conta-pet.html" method="GET" onsubmit="alert('Login efetuado com sucesso!');">
                
                <!-- Campo E-mail -->
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seuemail@dominio.com">
                </div>

                <!-- Campo Senha -->
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="Digite sua senha">
                </div>

                <!-- Opções extras -->
                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox"> Lembrar de mim
                    </label>
                    <a href="#" class="forgot-password" onclick="alert('Um link de recuperação foi enviado ao e-mail informado.');">Esqueceu a senha?</a>
                </div>

                <!-- Botão de Login -->
                <button type="submit" class="btn-login">Entrar</button>

                <!-- Link para Criar Conta -->
                <div class="register-link">
                    Ainda não tem cadastro? <a href="cadastro.html">Cadastre-se</a>
                </div>

            </form>
        </div>
    </main>

    <footer>
        <p>&copy;Táxi Pet Serviços Automotivos. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
